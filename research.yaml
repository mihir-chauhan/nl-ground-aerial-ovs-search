  why: ground sensing radius in cells
- name: tau_g
  value: 0.75
  why: ground candidate score threshold
- name: inspect_g
  value: 3
  why: steps of a ground verification
- name: air_speed
  value: 2
  why: aerial cells per step
- name: r_air
  value: 4
