  value: 8
  why: maximum number of rooms
- name: p_roof
  value: 0.3
  why: probability that a room is roofed
- name: n_objects
  value: 12
  why: small objects per world
- name: n_classes
  value: 20
  why: object classes
- name: n_groups
  value: 5
  why: similarity groups of classes
- name: n_colors
  value: 6
  why: object colours
- name: emb_dim
  value: 64
  why: dimension of the simulated word embeddings
- name: sig_g
  value: 0.05
