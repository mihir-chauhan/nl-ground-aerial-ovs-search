- name: p_conf
  value: 0.2
  why: aerial label confusion probability
- name: p_col
  value: 0.7
  why: probability the aerial robot perceives colour
- name: res
  value: 3
  why: aerial position quantisation block in cells
- name: inspect_a
  value: 10
  why: steps of an aerial descend-and-verify
- name: cap
  value: 100
  why: step cap per episode
- name: K
  value: 5
  why: steps between messages of one robot
- name: M
  value: 2
  why: sightings per message
- name: tau_send
  value: 0.6
