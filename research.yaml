slug: nl-ground-aerial-ovs-search
direction: Create a framework that has heterogeneous collaboration for open vocab
  search with ground and aerial robots talk in natural language
problem: In a simulated grid world, does natural-language communication between a
  ground robot and an aerial robot improve open-vocabulary object search success and
  time-to-find compared with structured/symbolic messaging and with non-communicating
  frontier exploration?
gap: Language-based air-ground and multi-robot systems report end-to-end performance
  of a full natural-language stack; they do not isolate the message format at a matched
  message budget, with identical agents, sensing and planning on paired layouts, and
  they do not separate what a message says (attributes, relations, confidence) from
  how its location is expressed (room name versus coordinates).
contribution: A small, fully scripted ground-aerial open-vocabulary search testbed
  in which only the message channel changes, a controlled comparison of templated
  natural-language against fixed-schema symbolic messaging across four query tiers,
  and a content/format decomposition (coordinates in language, attributes or confidence
  in the schema) with budget, corruption, sensing and team ablations.
hypotheses:
- id: H1
  statement: A ground-aerial team using templated natural-language messages achieves
    higher search success rate and lower mean steps-to-find than the same team using
    structured symbolic messages (fixed-schema coordinates and class IDs), at equal
    message budget.
  test: group main, metrics success and steps, NL messaging vs Symbolic messaging
    over all four tiers; group paired, task all (paired episode-level difference with
    bootstrap CI). Refuted if the difference is zero or favours symbolic.
- id: H2
  statement: The natural-language advantage over symbolic messaging grows as queries
    become more open-vocabulary (synonyms, attribute descriptions, relational phrases)
    and shrinks to zero or reverses for exact in-vocabulary class names.
  test: group paired, per-tier NL minus symbolic difference in steps, and the interaction
    task (attribute+relational minus exact+synonym). Refuted if the interaction CI
    includes zero or has the wrong sign.
- id: H3
  statement: The natural-language advantage shrinks under message corruption (dropped
    words, wrong-room references), which would show that gains depend on message fidelity
    rather than on the language channel itself.
  test: group sweep_corrupt on the mixed task, NL minus symbolic steps as a function
    of the corruption rate; group paired, tasks corrupt_*. Refuted if the difference
    does not move toward symbolic as corruption grows.
method:
  name: NL messaging
  summary: Ground-aerial frontier team whose robots exchange templated natural-language
    sentences (object, colour, nearby landmark, room name) that a rule-based parser
    reads and re-scores against the query.
  components:
  - templated natural-language speaker
  - rule-based keyword parser
  - receiver-side re-scoring of message content against the query
  - room-level candidate regions
  entrypoint: method/search.py --system nl --task {task} --seed {seed} --out $RH_METRICS_FILE
tasks:
- exact
- synonym
- attribute
- relational
- all
- mixed
metrics:
  success:
    higher_is_better: true
  steps:
    higher_is_better: false
  spl:
    higher_is_better: true
  msgs:
    higher_is_better: false
  tokens:
    higher_is_better: false
  overlap:
    higher_is_better: false
  aerial_find:
    higher_is_better: false
seeds:
- 0
- 1
- 2
- 3
- 4
compute:
  gpus: 0
  max_minutes_per_run: 10
  max_total_minutes: 45
baselines:
- Symbolic messaging
- Frontier team, no comm
- Single ground frontier
- Random-walk team
- Oracle sharing
ablations:
- {name: NL + coordinates, group: content}
- {name: Symbolic + attributes, group: content}
- {name: Symbolic + confidence, group: content}
- {name: 'NL, two ground robots', group: abl_team}
- {name: 'NL, two aerial robots', group: abl_team}
- {name: 'NL, priority rule', group: abl_team}
ambition:
  target_tier: 2
  primary_metric: steps
  primary_task: mixed
  alpha: 0.05
  min_relative_gain: 0.1
  min_effect_size: 0.8
  groundbreaking_gain: 0.3
  max_iterations: 12
  patience: 3
  gpu_hour_budget: 2
gates: []
profile: quick
venue: ieee-icra
